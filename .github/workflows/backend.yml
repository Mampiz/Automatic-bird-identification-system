# Backend: lint and unit tests.
#
# The tests stub ultralytics and cv2 (see backend/tests/conftest.py), so this job
# installs requirements-dev.txt rather than requirements.txt: no torch, no CUDA,
# no model weights. It runs in seconds and tests the logic that decides what the
# API returns. Anything that needs real inference belongs in an integration job
# with a GPU runner.
name: backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
