[pytest]
testpaths = tests
pythonpath = .
addopts = -q --strict-markers
filterwarnings =
    # The application still uses FastAPI's on_event and datetime.utcnow. Both are
    # deprecated and both are worth fixing, but a wall of warnings on every run
    # trains people to ignore output, so they are listed explicitly here rather
    # than silenced wholesale.
    ignore:on_event is deprecated:DeprecationWarning
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning
